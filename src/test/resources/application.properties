# Configuration of read-only connection to the database
# Required to test validator checks using `CheckConfig.INSTANCE.getJdbcTemplate()`
# Generated based on `Default` configuration

# Either `oracle.jdbc.OracleDriver` or `org.postgresql.Driver`
jdbc.driverClassName=oracle.jdbc.OracleDriver

# Examples: `jdbc:oracle:thin:@localhost:1521/FREEPDB1` or `jdbc:postgresql://localhost:5432/postgres`
jdbc.url=jdbc:oracle:thin:@localhost:1521/freepdb1

# Database user
jdbc.username=dbl_read

# Password of the database user
jdbc.password=
